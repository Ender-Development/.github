<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="60%" stop-color="#0b1510"/>
      <stop offset="100%" stop-color="#0d0118"/>
    </linearGradient>
    <radialGradient id="glowP" cx="88%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#ae45ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ae45ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="10%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#1cff62" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1cff62" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
<!--===== LOGO TEMPLATE: edit the string and font-size =====-->
    <text id="logo" x="256" y="256" dy="0.36em" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="260" font-weight="700">__</text>
<!--========================================================-->
  </defs>
<!--background-->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowP)"/>
  <rect width="512" height="512" fill="url(#glowG)"/>
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#1cff62" stroke-opacity="0.8" stroke-width="8"/>
  <rect x="38" y="38" width="436" height="436" rx="6" fill="none" stroke="#ae45ff" stroke-opacity="0.9" stroke-width="8"/>
  <g filter="url(#softGlow)">
    <use href="#logo" x="-3" y="-3" fill="#1cff62"/>
  </g>
</svg>
